<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Era — спільний арт</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Загальний арт 1920×1080: шари учнів один над одним у порядку з MASTER.psd (master-assets/layers.json). -->
  <div class="stage" id="stage"></div>

  <script>
    var stage = document.getElementById('stage');
    function fit() {
      var k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stage.style.transform = 'translate(-50%, -50%) scale(' + k + ')';
    }
    window.addEventListener('resize', fit);
    fit();

    Promise.all([
      fetch('master-assets/layers.json', { cache: 'no-store' }).then(function (r) { return r.json(); }),
      fetch('assets.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).catch(function () { return { items: [] }; })
    ]).then(function (res) {
      var order = res[0].layers || [];
      var version = {};
      (res[1].items || []).forEach(function (it) { version[it.name] = it.src; });
      order.forEach(function (name) {
        var img = document.createElement('img');
        img.src = version[name] || ('master-assets/' + name + '.png');
        img.alt = '';
        stage.appendChild(img);
      });
    });
  </script>
</body>
</html>
