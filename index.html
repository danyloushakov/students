<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Era — спільний арт</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Загальний арт 1920×1080: прев'ю MASTER.psd одним файлом (master-assets/MASTER.png, робить tools/export-art.jsx). -->
  <div class="stage" id="stage"></div>

  <script>
    var stage = document.getElementById('stage');
    function fit() {
      var k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stage.style.transform = 'translate(-50%, -50%) scale(' + k + ')';
    }
    window.addEventListener('resize', fit);
    fit();

    // Один загальний ассет: master-assets/MASTER.png (його оновлює tools/auto-master.cmd).
    // Кожні 15 с перевіряємо версію; нова картинка спершу вантажиться, потім м'яко підміняє стару.
    var current = '';
    function show(src) {
      if (src === current) return;
      current = src;
      var img = new Image();
      img.alt = '';
      img.onload = function () {
        stage.appendChild(img);
        requestAnimationFrame(function () { img.style.opacity = 1; });
        setTimeout(function () { while (stage.children.length > 1) stage.removeChild(stage.firstChild); }, 700);
      };
      img.src = src;
    }
    function check() {
      fetch('assets.json', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (a) {
          (a.items || []).forEach(function (it) { if (it.name === 'MASTER') show(it.src); });
        })
        .catch(function () { show('master-assets/MASTER.png'); });
    }
    check();
    setInterval(check, 15000);
  </script>
</body>
</html>
